name: Security audit

# Lint runs pip-audit on push and PR; this catches advisories published
# against the locked dependencies while nothing is being committed.
on:
  schedule:
    - cron: "17 6 * * 5" # Fridays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - run: uv sync --locked --extra test
      - run: uv run pip-audit
